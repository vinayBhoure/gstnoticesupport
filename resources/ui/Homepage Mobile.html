<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homepage — Mobile (375–430px)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:#EAEEF3;color:#0F172A;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;}
  .head{text-align:center;margin-bottom:22px;max-width:560px;}
  .head .eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#0B8B4E;margin-bottom:8px;}
  .head h1{font-size:22px;font-weight:700;color:#0A2540;letter-spacing:-.01em;}
  .head p{font-size:14px;color:#5A6878;margin-top:8px;line-height:1.5;}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
  #frameWrap{transform-origin:top center;}
  .hint{margin-top:14px;font-size:13px;color:#5A6878;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;}
  .hint span{display:inline-flex;align-items:center;gap:6px;}
  .hint .dot{width:6px;height:6px;border-radius:50%;background:#0B8B4E;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
</head>
<body>
  <div class="head">
    <div class="eyebrow">Responsive · 375–430px viewport</div>
    <h1>Homepage — Mobile</h1>
    <p>The live, fully-responsive homepage at phone width. Scroll, open the menu, swipe the team &amp; testimonial cards — every interaction is real.</p>
  </div>
  <div class="stage">
    <div id="frameWrap"><div id="root"></div></div>
  </div>
  <div class="hint">
    <span><span class="dot"></span>Tap ☰ for the slide-in drawer</span>
    <span><span class="dot"></span>Swipe team &amp; testimonial cards</span>
    <span><span class="dot"></span>Scroll to reveal the sticky bottom bar</span>
  </div>

<script type="text/babel">
  const { useEffect } = React;
  function MobilePreview(){
    return (
      <IOSDevice width={402} height={860}>
        <div style={{height:'100%',paddingTop:52,paddingBottom:20,display:'flex'}}>
          <iframe
            src="Homepage.html"
            title="GST Notice Support homepage (mobile)"
            style={{flex:1,width:'100%',border:'none',background:'#fff'}}
          />
        </div>
      </IOSDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<MobilePreview />);

  // Scale the frame to fit the viewport height
  function fit(){
    const wrap = document.getElementById('frameWrap');
    const avail = window.innerHeight - 230;
    const scale = Math.min(1, Math.max(0.4, avail / 860));
    wrap.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  setTimeout(fit, 120);
</script>
</body>
</html>
