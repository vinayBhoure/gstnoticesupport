<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Viewer — Mobile (375–430px)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter',system-ui,sans-serif; background:#EAEEF3; color:#0F172A; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 16px 40px; }
  .head{ text-align:center; margin-bottom:22px; max-width:560px; }
  .head .eyebrow{ font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#0B8B4E; margin-bottom:8px; }
  .head h1{ font-size:22px; font-weight:700; color:#0A2540; letter-spacing:-.01em; }
  .head p{ font-size:14px; color:#5A6878; margin-top:8px; line-height:1.5; }
  .stage{ flex:1; display:flex; align-items:center; justify-content:center; width:100%; }
  #frameWrap{ transform-origin:top center; }
  .hint{ margin-top:14px; font-size:13px; color:#5A6878; display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center; }
  .hint span{ display:inline-flex; align-items:center; gap:6px; }
  .hint .dot{ width:6px; height:6px; border-radius:50%; background:#0B8B4E; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
</head>
<body>
  <div class="head">
    <div class="eyebrow">Responsive · 375–430px viewport</div>
    <h1>Draft Viewer — Mobile</h1>
    <p>Download-prompt card replaces inline PDF viewer. Tap ☰ for the account drawer. Corner switcher toggles Loaded → Expired states.</p>
  </div>
  <div class="stage">
    <div id="frameWrap"><div id="root"></div></div>
  </div>
  <div class="hint">
    <span><span class="dot"></span>No inline PDF — native PDF viewer opens on tap</span>
    <span><span class="dot"></span>Expiry countdown ticking live</span>
    <span><span class="dot"></span>Corner switch: Loaded / Expired</span>
  </div>

<script type="text/babel">
  function MobilePreview(){
    return (
      <IOSDevice width={402} height={860}>
        <div style={{height:'100%',paddingTop:52,paddingBottom:20,display:'flex'}}>
          <iframe
            src="Draft Viewer Mobile Screen.html"
            title="GST Notice Support draft viewer (mobile)"
            style={{flex:1,width:'100%',border:'none',background:'#F7F9FC'}}
          />
        </div>
      </IOSDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<MobilePreview />);

  function fit(){
    const wrap = document.getElementById('frameWrap');
    const avail = window.innerHeight - 230;
    const scale = Math.min(1, Math.max(0.4, avail / 860));
    wrap.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  setTimeout(fit, 120);
</script>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0A2540"/>
    <rect x="34" y="20" width="32" height="60" rx="5" fill="#fff"/>
    <rect x="42" y="30" width="16" height="16" rx="8" fill="#E5E9F0"/>
    <rect x="40" y="50" width="20" height="4" rx="2" fill="#0B8B4E"/>
    <rect x="40" y="58" width="20" height="4" rx="2" fill="#1B3A6B"/>
    <rect x="34" y="72" width="32" height="8" rx="0 0 5 5" fill="#1B3A6B"/>
  </svg>
</template>
</body>
</html>
